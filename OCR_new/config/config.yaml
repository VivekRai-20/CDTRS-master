# =============================================================================
# Offline OCR System — Global Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Offline Mode (HARD requirement — do not set to false for runtime operation)
# ---------------------------------------------------------------------------
offline_mode: true

# ---------------------------------------------------------------------------
# Paths  (relative to project root)
# ---------------------------------------------------------------------------
paths:
  models_dir:   "models/paddleocr"
  input_dir:    "input"
  output_dir:   "output"
  temp_dir:     "temp"
  patterns_file: "extraction/patterns.yaml"

# ---------------------------------------------------------------------------
# PaddleOCR Settings  (PaddleOCR 2.8.1 / paddlepaddle 2.6.2 - see requirements.txt)
# ---------------------------------------------------------------------------
paddleocr:
  lang: "en"              # Language code: 'en', 'ch', 'latin', etc.
  ocr_version: "PP-OCRv4" # PaddleOCR 2.x model family (en: PP-OCRv3 detection + PP-OCRv4 recognition)
  use_gpu: false          # The pinned paddlepaddle build is CPU-only

  # Text-line orientation (0 / 180 degrees) classifier.
  use_textline_orientation: true

  # Text detection, tuned for faint handwriting strokes.
  #   text_det_limit_side_len: pages are scaled so the longest side is at most this.
  #   text_det_thresh / text_det_box_thresh: lower = keeps fainter text.
  #   text_det_unclip_ratio: margin around each text box (1.8 merged lines).
  text_det_limit_side_len: 1920
  text_det_limit_type: "max"
  text_det_thresh: 0.2
  text_det_box_thresh: 0.4
  text_det_unclip_ratio: 1.6

  # Local model folders (filled once by `python setup_models.py`).
  det_model_dir: "models/paddleocr/det"
  rec_model_dir: "models/paddleocr/rec"
  cls_model_dir: "models/paddleocr/cls"

  # Minimum confidence to keep a recognised text line (0.0 - 1.0).
  drop_score: 0.25

  # Memory limits.  Paddle keeps working memory for every input shape it has
  # seen and never frees it, so the engine limits the shapes it uses:
  #   det_square_pad  - pages are padded to one of three square sizes
  #   rec_batch_num   - text lines are read one at a time
  #   rec_ratio_step  - line widths are rounded up to multiples of 8 x height
  #   rec_max_ratio   - lines longer than 32 x height are narrowed to fit
  # Without these a single A4 scan needed more than 6 GB of memory.
  det_square_pad: true
  rec_batch_num: 1
  rec_ratio_step: 8
  rec_max_ratio: 32

# ---------------------------------------------------------------------------
# Printed / handwritten detection (ocr/text_type_detector.py)
# ---------------------------------------------------------------------------
text_type_detection:
  enabled: true
  # A classifier trained on your own labelled lines is used when
  # <model_path>/classifier.pkl exists (fineTune/training/train.py --task text_type);
  # otherwise the built-in model is used.
  model_path: "models/classifiers/text_type"

# ---------------------------------------------------------------------------
# Handwriting recognition (ocr/handwriting_engine.py, TrOCR)
# ---------------------------------------------------------------------------
handwriting:
  enabled: true
  # Folder of handwriting models; models/handwriting/active.txt names the one in use.
  # Base model: python fineTune/download_base_model.py
  # Your own:   python fineTune/training/train.py --task handwriting
  model_path: "models/handwriting"
  device: "cpu"
  num_beams: 3
  max_new_tokens: 64
  # Lines that are HANDWRITTEN, or UNKNOWN with PaddleOCR confidence below
  # this, are read again by the handwriting model.
  replace_below_confidence: 0.9
  # The handwriting reading replaces PaddleOCR's only when it is at least this
  # confident AND at least as confident as PaddleOCR.
  min_confidence: 0.5
  max_lines_per_page: 80

# ---------------------------------------------------------------------------
# Document classification (classification/)
# ---------------------------------------------------------------------------
classification:
  # Optional classifier trained on your own documents:
  #   python fineTune/training/train.py --task classification
  # Used instead of the keyword rules when it is at least this confident.
  model_path: "models/classifiers/document"
  min_model_confidence: 0.6

# ---------------------------------------------------------------------------
# Named-entity recognition (nlp/ner_engine.py)
# ---------------------------------------------------------------------------
ner:
  enabled: true
  # A spaCy model folder under model_path is used first; otherwise the
  # installed spaCy package named in `package`; otherwise regex patterns only.
  model_path: "models/ner"
  package: "en_core_web_sm"
  backend: "spacy"          # "regex" = never use spaCy

# ---------------------------------------------------------------------------
# Image Preprocessing  (each step can be toggled independently)
# ---------------------------------------------------------------------------
preprocessing:
  enabled: true
  # Individual steps -- disable any that slow down or degrade your documents
  grayscale: false
  denoise: false
  contrast_enhance: false
  # Adaptive thresholding (useful for low-contrast/dirty scans; keep false for clean digital PDFs/photos)
  threshold: false
  # Method used when threshold is true: "adaptive" | "otsu"
  threshold_method: "adaptive"

  # IMPORTANT — keep both deskew and auto_rotate FALSE for handwritten documents.
  #
  # deskew: The Hough-line algorithm measures the most common angle in the image and
  #   treats it as document skew. Handwriting strokes naturally scatter across many angles
  #   (italics, cursive, mixed slants), so the dominant angle found is the average of
  #   handwriting inclinations — NOT a true document tilt. Rotating by that angle physically
  #   warps the page and garbles the text fed to PaddleOCR.
  deskew: false

  # auto_rotate: The projection-variance heuristic can mistake a page of handwriting for
  #   a rotated page (especially when many strokes are diagonal). This causes full 90°/180°
  #   flips that produce the upside-down / mirrored text seen in the output.
  #   PaddleOCR's use_textline_orientation already handles per-line rotation correctly;
  #   this coarse page-level rotation is redundant and harmful for handwritten content.
  auto_rotate: false

  # Remove thin borders / scan artefacts
  border_removal: false
  # Upscale factor for very small images (1.0 = no scaling)
  upscale_factor: 1.0
  # Minimum DPI to target when rendering PDF pages
  pdf_render_dpi: 300

# ---------------------------------------------------------------------------
# PDF Processing
# ---------------------------------------------------------------------------
pdf:
  # DPI to use when converting PDF pages to images
  dpi: 300
  # Image format for intermediate page renders
  page_image_format: "PNG"
  # Keep temp page images after processing
  keep_temp_pages: false

# ---------------------------------------------------------------------------
# DOCX Processing
# ---------------------------------------------------------------------------
docx:
  # Extract embedded images from DOCX and run OCR on them
  extract_embedded_images: true

# ---------------------------------------------------------------------------
# Output Settings
# ---------------------------------------------------------------------------
output:
  # Save individual OCR fields as plain text
  save_txt: true
  # Save full structured OCR result as JSON
  save_json: true
  # Pretty-print JSON output
  json_indent: 2
  # Include image crops of each detected text region in output
  save_region_crops: false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "ocr_system.log"
  log_dir: "output"
  max_bytes: 5242880      # 5 MB per log file
  backup_count: 3
